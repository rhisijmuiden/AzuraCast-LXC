name: AzuraCast-LXC native checks

on:
  pull_request:
    branches:
      - main
      - test
  workflow_call:

jobs:
  shell:
    name: Native scripts (bash -n, shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in native/install.sh native/build-release.sh native/lib/*.sh native/sbin/* native/startup/*.sh; do
            bash -n "$f"
          done
      - name: ShellCheck
        run: shellcheck -S error native/install.sh native/build-release.sh native/lib/*.sh native/sbin/* native/startup/*.sh

  php:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --ignore-platform-reqs
      - run: vendor/bin/parallel-lint --exclude vendor backend
