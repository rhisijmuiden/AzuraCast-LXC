; AzuraCast-LXC supervisord configuration.
; Same layout as the upstream Docker image: base services in minimal.conf.d, application services in
; full.conf.d and one file per radio station written by AzuraCast itself. AzuraCast controls the
; station processes (Liquidsoap, Icecast) through this supervisord's XML-RPC socket.

[unix_http_server]
file = /var/run/supervisor.sock
chmod = 0660
chown = azuracast:azuracast

[supervisord]
user = root
nodaemon = true
logfile = /var/azuracast/www_tmp/supervisord.log
logfile_maxbytes = 50MB
logfile_backups = 10
loglevel = info
pidfile = /var/run/supervisord.pid
minfds = 65000
minprocs = 200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl = unix:///var/run/supervisor.sock

[include]
files = minimal.conf.d/*.conf full.conf.d/*.conf /var/azuracast/stations/*/config/supervisord.conf
